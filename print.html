<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print Flashcards</title>
  <style>
    @page {
      size: A4;
      margin: 10mm;
    }
    body {
      font-family: "Trebuchet MS", Arial, sans-serif;
      margin: 0;
    }
    .sheet {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6mm;
    }
    .card {
      border: 1px dashed #999;
      height: 85mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      break-inside: avoid;
    }
    .card img {
      width: 100%;
      height: 60mm;
      object-fit: contain;
    }
    .card h2 {
      margin: 4mm 0 0 0;
      font-size: 22pt;
      color: #3a7ca5;
    }
    .bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      color: #3a7ca5;
      font-size: 18px;
    }
    .bar button,
    .bar a.choice {
      font-family: inherit;
      font-size: 18px;
      padding: 8px 18px;
      border: none;
      border-radius: 10px;
      background-color: #3a7ca5;
      color: white;
      cursor: pointer;
    }
    #picture-choice {
      display: flex;
      gap: 8px;
    }
    #picture-choice[hidden] {
      display: none;
    }
    .bar a.choice {
      white-space: nowrap;
      text-decoration: none;
      background-color: white;
      color: #3a7ca5;
      border: 2px solid #3a7ca5;
    }
    .bar a.choice.chosen {
      background-color: #3a7ca5;
      color: white;
    }
    @media screen {
      body { padding: 20px; background: #f4faf0; }
    }
    @media print {
      .bar { display: none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <button onclick="window.print()">🖨 Print</button>
    <span id="heading"></span>
    <span id="picture-choice" hidden>
      <a class="choice" id="choose-photos">📷 Photos</a>
      <a class="choice" id="choose-drawings">✏️ Drawings</a>
    </span>
  </div>
  <div class="sheet" id="sheet"></div>

  <script src="topics.js"></script>
  <script>
    // Which topic to print comes from the address, e.g. print.html?topic=animals
    const params = new URLSearchParams(location.search);
    const topicKey = TOPICS[params.get("topic")] ? params.get("topic") : "animals";
    const topic = TOPICS[topicKey];

    // Topics with drawn pictures can print either photos or drawings, e.g. print.html?topic=shapes&pictures=drawings
    const hasDrawings = topic.cards.every(card => card.drawing);
    const useDrawings = hasDrawings && params.get("pictures") === "drawings";
    if (hasDrawings) {
      document.getElementById("picture-choice").hidden = false;
      document.getElementById("choose-photos").href = "print.html?topic=" + topicKey;
      document.getElementById("choose-drawings").href = "print.html?topic=" + topicKey + "&pictures=drawings";
      document.getElementById(useDrawings ? "choose-drawings" : "choose-photos").classList.add("chosen");
    }
    document.title = topic.title + " Flashcards (Print)";
    document.getElementById("heading").textContent = topic.title + " flashcards: cut along the dashed lines";

    const sheet = document.getElementById("sheet");
    topic.cards.forEach(card => {
      const div = document.createElement("div");
      div.className = "card";
      const img = document.createElement("img");
      img.src = useDrawings ? card.drawing : card.picture;
      img.alt = card.word;
      const word = document.createElement("h2");
      word.textContent = card.word;
      div.append(img, word);
      sheet.appendChild(div);
    });
  </script>
</body>
</html>
