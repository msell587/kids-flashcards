<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print Flashcards</title>
  <style>
    @page {
      size: A4;
      margin: 10mm;
    }
    body {
      font-family: "Trebuchet MS", Arial, sans-serif;
      margin: 0;
    }
    .sheet {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6mm;
    }
    .card {
      border: 1px dashed #999;
      height: 85mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      break-inside: avoid;
    }
    .card img {
      width: 100%;
      height: 60mm;
      object-fit: contain;
    }
    .card h2 {
      margin: 4mm 0 0 0;
      font-size: 22pt;
      color: #3a7ca5;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      color: #3a7ca5;
      font-size: 18px;
    }
    .bar button {
      font-family: inherit;
      font-size: 18px;
      padding: 8px 18px;
      border: none;
      border-radius: 10px;
      background-color: #3a7ca5;
      color: white;
      cursor: pointer;
    }
    @media screen {
      body { padding: 20px; background: #f4faf0; }
    }
    @media print {
      .bar { display: none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <button onclick="window.print()">🖨 Print</button>
    <span id="heading"></span>
  </div>
  <div class="sheet" id="sheet"></div>

  <script src="topics.js"></script>
  <script>
    // Which topic to print comes from the address, e.g. print.html?topic=animals
    const topic = TOPICS[new URLSearchParams(location.search).get("topic")] || TOPICS.animals;
    document.title = topic.title + " Flashcards (Print)";
    document.getElementById("heading").textContent = topic.title + " flashcards: cut along the dashed lines";

    const sheet = document.getElementById("sheet");
    topic.cards.forEach(card => {
      const div = document.createElement("div");
      div.className = "card";
      const img = document.createElement("img");
      img.src = card.picture;
      img.alt = card.word;
      const word = document.createElement("h2");
      word.textContent = card.word;
      div.append(img, word);
      sheet.appendChild(div);
    });
  </script>
</body>
</html>
