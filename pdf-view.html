<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View PDF</title>
  <meta name="theme-color" content="#2f6f9f">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Shows a printable PDF first; the Download PDF button saves it when the teacher is ready */
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg, #fdf8f0);
      color: var(--word-dark);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .bar h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }
    .bar nav {
      display: flex;
      gap: 8px;
    }
    .bar a {
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      border: 2px solid var(--word);
      color: var(--word);
      background: #fff;
    }
    .bar a.primary {
      background: var(--word);
      color: #fff;
    }
    .viewer {
      flex: 1;
      width: 100%;
      border: 0;
    }
    .fallback {
      padding: 16px;
      text-align: center;
      font-size: 18px;
    }
    .gate {
      margin: 24px auto;
      padding: 20px;
      max-width: 420px;
      width: calc(100% - 32px);
      background: #fff;
      border-radius: 20px;
      box-shadow: var(--shadow);
      text-align: center;
      font-size: 18px;
    }
    .gate p {
      margin: 0 0 12px;
    }
    .gate input {
      font: inherit;
      font-size: 18px;
      padding: 10px 14px;
      border: 2px solid var(--word);
      border-radius: 12px;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .gate button {
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      padding: 10px 22px;
      border: 0;
      border-radius: 999px;
      background: var(--word);
      color: #fff;
      cursor: pointer;
    }
    .gate .error {
      color: #b00020;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <header class="bar">
    <h1 id="title">Printable sheet</h1>
    <nav>
      <a href="#" id="back-btn">Back</a>
      <a class="primary" id="download-btn" href="#" download>Download PDF</a>
    </nav>
  </header>
  <section class="gate" id="gate" hidden>
    <form id="gate-form">
      <p>Coloring sheets are for teachers. Enter your access code to see this sheet.</p>
      <input id="gate-code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Teacher access code">
      <button type="submit">Show sheet</button>
      <p class="error" id="gate-error" role="alert"></p>
    </form>
    <p id="gate-checking" hidden>Checking the code…</p>
    <p id="gate-off" hidden>Coloring sheets are not set up yet. Please try again later.</p>
  </section>
  <iframe class="viewer" id="viewer" title="Printable sheet"></iframe>
  <p class="fallback" id="fallback" hidden>
    This browser can't show the sheet here. <a id="open-link" href="#" target="_blank" rel="noopener">Open the sheet</a>
  </p>
  <script type="module">
    import { isGatedSheet, fetchSheet, sheetWorkerIsSetUp } from "./sheet-access.js";

    const params = new URLSearchParams(location.search);
    const file = params.get("file") || "";
    const name = params.get("name") || "Printable sheet.pdf";
    // Only the project's own PDFs can be shown, so the page cannot be used to open other sites
    const allowed = /^(printables|images)\/[^:]*\.pdf$/i.test(file) && !file.includes("..");

    const viewer = document.getElementById("viewer");
    const downloadBtn = document.getElementById("download-btn");
    const openLink = document.getElementById("open-link");
    const gate = document.getElementById("gate");
    const gateForm = document.getElementById("gate-form");
    const gateCode = document.getElementById("gate-code");
    const gateError = document.getElementById("gate-error");
    const gateChecking = document.getElementById("gate-checking");
    const STORED_CODE = "sheetAccessCode";

    // The code is remembered only for this visit (until the tab is closed), so a teacher does not
    // retype it for every sheet, but the next visit asks again.
    try { localStorage.removeItem(STORED_CODE); } catch { /* older versions kept it for good: clear that copy */ }
    function readStoredCode() {
      try { return sessionStorage.getItem(STORED_CODE) || ""; } catch { return ""; }
    }
    function storeCode(code) {
      try { sessionStorage.setItem(STORED_CODE, code); } catch { /* storage blocked: just ask again next time */ }
    }
    function forgetCode() {
      try { sessionStorage.removeItem(STORED_CODE); } catch { /* nothing to clear */ }
    }

    // While a code is being checked, show "Checking the code…" instead of the code box
    function showChecking(checking) {
      gateForm.hidden = checking;
      gateChecking.hidden = !checking;
    }

    function showSheet(src) {
      viewer.src = src;
      downloadBtn.href = src;
      downloadBtn.setAttribute("download", name);
      downloadBtn.hidden = false;
      openLink.href = src;
      viewer.hidden = false;
      gate.hidden = true;
    }

    async function tryCode(code, fromStorage) {
      gateError.textContent = "";
      showChecking(true);
      try {
        const blob = await fetchSheet(file, code);
        storeCode(code);
        showSheet(URL.createObjectURL(blob));
      } catch (error) {
        // Forget a saved code only when it is wrong, not when the network or the script has a hiccup
        if (fromStorage && error.status === 403) forgetCode();
        gateError.textContent = error.status === 403
          ? "That code is not right. Please check it and try again."
          : "The sheet could not be loaded. Please try again later.";
        gate.hidden = false;
      } finally {
        showChecking(false);
      }
    }

    if (allowed) {
      document.getElementById("title").textContent = name.replace(/\.pdf$/i, "");
      if (!isGatedSheet(file)) {
        // Ordinary printables are public
        showSheet(encodeURI(file));
      } else {
        // Coloring sheets are only sent by the Google Apps Script after a teacher enters a valid code
        viewer.hidden = true;
        downloadBtn.hidden = true;
        gate.hidden = false;
        if (!sheetWorkerIsSetUp()) {
          gateForm.hidden = true;
          document.getElementById("gate-off").hidden = false;
        } else {
          gateForm.addEventListener("submit", event => {
            event.preventDefault();
            const code = gateCode.value.trim();
            if (code) tryCode(code, false);
          });
          const saved = readStoredCode();
          if (saved) tryCode(saved, true);
        }
      }
    } else {
      document.getElementById("title").textContent = "Sheet not found";
      viewer.remove();
      downloadBtn.remove();
      document.getElementById("fallback").hidden = false;
    }
    document.getElementById("back-btn").addEventListener("click", event => {
      if (history.length > 1) {
        event.preventDefault();
        history.back();
      }
    });
  </script>
</body>
</html>
