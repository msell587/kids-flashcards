<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Season Quiz</title>
  <meta name="theme-color" content="#2f6f9f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="game.css">
  <style>
    /* Season Quiz: a photo from any season, and the child taps the right season.
       Eight pictures, two from each season, in a random order. */
    .quiz-pic-box {
      width: min(90vw, 460px);
      height: min(40vh, 340px);
      margin: 12px auto 0 auto;
      border-radius: 28px;
      border: 6px solid #fff;
      box-sizing: border-box;
      box-shadow: var(--shadow);
      background-color: #fff;
      overflow: hidden;
    }
    .quiz-pic {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .season-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: min(94vw, 640px);
      margin: 16px auto 0 auto;
    }
    .season-btn {
      padding: 14px 8px;
      border: 4px solid transparent;
      border-radius: 22px;
      background-color: var(--surface);
      color: var(--word-dark);
      font-family: var(--font);
      font-size: 22px;
      font-weight: 800;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .season-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lift);
    }
    .season-btn.right {
      border-color: #2e9e44;
      background-color: #e6f6ea;
    }
    .season-btn.wrong {
      opacity: 0.45;
    }
    .season-btn:disabled {
      cursor: default;
    }
    .quiz-word {
      min-height: 40px;
      margin: 8px 0 0 0;
      font-size: 26px;
      font-weight: 800;
      color: var(--word-dark);
      text-align: center;
    }
    .quiz-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    .quiz-controls button {
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      background-color: var(--surface);
      color: var(--word-dark);
      font-family: var(--font);
      font-size: 18px;
      font-weight: 800;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .quiz-controls button.primary {
      background-color: var(--word);
      color: #fff;
    }
    .quiz-controls button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .score-stars {
      font-size: 48px;
      letter-spacing: 6px;
      margin: 8px 0;
    }
    @media (max-width: 500px) {
      .season-buttons {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <main>
    <div class="panel" id="setup">
      <div class="big-emoji">🌦️</div>
      <h1>Season Quiz</h1>
      <p>Look at the picture. Which season is it?</p>
      <button class="big-btn" id="start-btn" type="button">Let's start!</button>
    </div>
    <div id="play" hidden>
      <p class="top-row" style="justify-content:center">
        <span id="progress"></span>
      </p>
      <div class="quiz-pic-box">
        <img class="quiz-pic" id="pic" alt="Picture to guess the season of">
      </div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <p class="quiz-word" id="word" aria-live="polite"></p>
      <div class="season-buttons" id="choices"></div>
      <div class="quiz-controls">
        <button type="button" id="next-btn" class="primary" disabled>Next picture</button>
        <button type="button" data-big-screen>Big screen</button>
      </div>
    </div>
    <div class="panel" id="end" hidden>
      <div class="big-emoji">🎉</div>
      <h1>Well done!</h1>
      <p class="score-stars" id="stars"></p>
      <p id="end-message"></p>
      <button class="big-btn" id="again-btn" type="button">Play again</button>
    </div>
    <nav class="links">
      <a class="link-btn" id="back-btn" href="teacher.html?topic=seasons">Back</a>
      <a class="link-btn" href="index.html">Home</a>
    </nav>
  </main>
  <script src="voice.js"></script>

    },
    {

    },

    },
    {

      "src": "images/summer-guess/surfboard.jpg"
    },
    {
      "word": "kite",
      "src": "images/summer-guess/kite.jpg"
    },
    {
      "word": "beach ball",
      "src": "images/summer-guess/beach ball.jpg"
    }
  ]
};
    const SEASONS = [
      { key: "spring", label: "Spring", emoji: "🌷" },
      { key: "summer", label: "Summer", emoji: "☀️" },
      { key: "autumn", label: "Autumn", emoji: "🍂" },
      { key: "winter", label: "Winter", emoji: "❄️" }
    ];
    const PER_SEASON = 2;   // eight questions in all
    const canSpeak = Voice.supported;
    const $ = id => document.getElementById(id);
    let questions = [];
    let index = 0;
    let firstTryRight = 0;
    let answered = false;
    let missed = false;

    function shuffled(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
    function say(text) {
      if (canSpeak) Voice.speak(text);
    }
    function show(id) {
      for (const panel of ["setup", "play", "end"]) {
        $(panel).hidden = panel !== id;
      }
    }
    function startQuiz() {
      // Two random pictures from each season, then shuffled together
      questions = shuffled(SEASONS.flatMap(season =>
        shuffled(PICTURES[season.key]).slice(0, PER_SEASON).map(item => ({ ...item, season: season.key }))
      ));
      index = 0;
      firstTryRight = 0;
      show("play");
      showQuestion();
    }
    function showQuestion() {
      const item = questions[index];
      answered = false;
      missed = false;
      $("progress").textContent = (index + 1) + " / " + questions.length;
      $("pic").src = encodeURI(item.src);
      $("pic").alt = "Picture to guess the season of";
      $("feedback").textContent = "";
      $("word").textContent = "";
      $("next-btn").disabled = true;
      $("next-btn").textContent = index === questions.length - 1 ? "See my score" : "Next picture";
      $("choices").innerHTML = SEASONS.map(season =>
        `<button type="button" class="season-btn" data-season="${season.key}">${season.emoji} ${season.label}</button>`
      ).join("");
    }
    function choose(event) {
      const button = event.target.closest(".season-btn");
      if (!button || answered) return;
      const item = questions[index];
      const chosen = button.dataset.season;
      const label = SEASONS.find(s => s.key === chosen).label;
      const right = chosen === item.season;
      if (right) {
        answered = true;
        button.classList.add("right");
        if (!missed) firstTryRight++;
        $("feedback").textContent = "Yes! It's " + item.season + "!";
        $("word").textContent = item.word;
        say("Yes! It's " + item.season + ". " + Voice.praise());
        document.querySelectorAll(".season-btn").forEach(b => b.disabled = true);
        $("next-btn").disabled = false;
      } else {
        missed = true;
        button.classList.add("wrong");
        button.disabled = true;
        $("feedback").textContent = label + "? Try another one.";
        say("Not quite. Try another one.");
      }
    }
    function nextQuestion() {
      index++;
      if (index >= questions.length) {
        finish();
      } else {
        showQuestion();
      }
    }
    function finish() {
      show("end");
      const stars = Math.max(1, Math.round((firstTryRight / questions.length) * 5));
      $("stars").textContent = "⭐".repeat(stars);
      $("end-message").textContent = "You got " + firstTryRight + " of " + questions.length + " right the first time.";
      say("You got " + firstTryRight + " of " + questions.length + " right!");
    }

    $("start-btn").addEventListener("click", startQuiz);
    $("again-btn").addEventListener("click", startQuiz);
    $("choices").addEventListener("click", choose);
    $("next-btn").addEventListener("click", nextQuestion);
  </script>
  <script src="bigscreen.js"></script>
  <script src="pwa.js"></script>

</html>
