<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animal Flashcards</title>
  <meta name="theme-color" content="#2f6f9f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .group-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .group-bar button { padding: 8px 18px; border: 0; border-radius: 999px; background: var(--surface, #fff); color: var(--word-dark, #2a4a63); font: inherit; font-weight: 800; box-shadow: var(--shadow); cursor: pointer; }
    .group-bar button.on { background: var(--word, #2f6f9f); color: #fff; }
  </style>
</head>
<body>
  <div class="bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <nav class="topbar">
    <a class="home" href="index.html">Home</a>
    <span class="topic-title">Animals</span>
  </nav>
  <!-- Sub-topics: show all the animals, or only the farm, pet or wild ones -->
  <div class="group-bar" role="group" aria-label="Show animals">
    <button type="button" data-group="all" class="on">All</button>
    <button type="button" data-group="farm">Farm</button>
    <button type="button" data-group="pets">Pets</button>
    <button type="button" data-group="wild">Wild</button>
  </div>
  <div class="card">
    <img id="picture" src="images/animals/elephant.jpg" alt="elephant">
    <h1 id="word" aria-live="polite">elephant</h1>
    <button class="speak" onclick="speakWord()" aria-label="Say the word">🔊</button>
  </div>
  <div class="nav-buttons">
    <button class="secondary" onclick="prevCard()">Back</button>
    <p id="counter">1 / 11</p>
    <button onclick="nextCard()">Next</button>
  </div>

  <script src="topics.js"></script>
  <script>
    const cards = TOPICS.animals.cards;
  </script>
  <script src="voice.js"></script>
  <script src="flashcards.js"></script>
  <script>
    // Sub-topics: the buttons show only the chosen group of animals
    document.querySelectorAll(".group-bar button").forEach(button => {
      button.addEventListener("click", () => {
        const group = button.dataset.group;
        document.querySelectorAll(".group-bar button").forEach(b => b.classList.toggle("on", b === button));
        deck = group === "all" ? cards.slice() : cards.filter(c => c.group === group);
        current = 0;
        hideCelebration();
        showCard(0);
      });
    });
  </script>
  <script src="animals.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
