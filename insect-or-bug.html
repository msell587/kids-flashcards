<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insect or Bug?</title>
  <meta name="theme-color" content="#2f6f9f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="game.css">
  <style>
    /* Insect or Bug: look at the picture, then choose. Insects have 6 legs and 3 body parts. */
    .pic-box {
      width: min(90vw, 420px);
      height: min(40vh, 320px);
      margin: 12px auto 0 auto;
      border-radius: 28px;
      border: 6px solid #fff;
      box-sizing: border-box;
      box-shadow: var(--shadow);
      background: #fff;
      overflow: hidden;
    }
    .pic-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .name {
      margin: 12px 0 0 0;
      font-size: 34px;
      font-weight: 800;
      color: var(--word-dark);
      text-align: center;
    }
    .choices {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 14px;
    }
    .choices button {
      padding: 14px 28px;
      border: 0;
      border-radius: 999px;
      background: var(--surface);
      color: var(--word-dark);
      font-family: var(--font);
      font-size: 22px;
      font-weight: 800;
      box-shadow: var(--shadow);
      cursor: pointer;
    }
    .choices button:disabled {
      cursor: default;
      opacity: 0.6;
    }
    .choices button.right {
      background: #e6f6ea;
      border: 4px solid #2e9e44;
    }
    .choices button.wrong {
      opacity: 0.45;
    }
    .explain {
      min-height: 48px;
      margin: 12px auto 0 auto;
      font-size: 20px;
      color: var(--word-dark);
      text-align: center;
      max-width: 90vw;
    }
    .score {
      font-size: 18px;
      color: var(--muted);
      text-align: center;
    }
    .next {
      display: block;
      margin: 12px auto 0 auto;
    }
    /* Big screen button: styled like the Back and Next buttons on the other pages */
    .big-screen-row {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }
    .big-screen-row button {
      padding: 10px 28px;
      border: 2px solid var(--word);
      border-radius: 999px;
      background: #fff;
      color: var(--word);
      font-family: var(--font);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
    /* Big screen: the picture and the choices grow to fill a TV or projector */
    body.big-screen .pic-box {
      width: min(96vw, 130vh);
      height: 56vh;
    }
    body.big-screen .name {
      font-size: clamp(40px, 5vw, 64px);
    }
    body.big-screen .choices button {
      font-size: clamp(30px, 3.6vw, 48px);
      padding: 18px 36px;
    }
    body.big-screen .explain {
      font-size: clamp(24px, 2.6vw, 34px);
    }
  </style>
</head>
<body>
  <div class="bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <main>
    <div class="panel" id="setup">
      <div class="big-emoji">🐞</div>
      <h1>Insect or Bug?</h1>
      <p>Is it an insect? Insects have 6 legs and 3 body parts.</p>
      <button class="big-btn" id="start-btn" type="button">Let's play!</button>
    </div>
    <div id="play" hidden>
      <p class="score" id="progress"></p>
      <div class="pic-box"><img id="pic" alt=""></div>
      <p class="name" id="name"></p>
      <div class="choices">
        <button type="button" id="insect-btn">Insect</button>
        <button type="button" id="bug-btn">Bug</button>
      </div>
      <p class="explain" id="explain" aria-live="polite"></p>
      <button class="big-btn next" id="next-btn" type="button" hidden>Next</button>
    </div>
    <div class="panel" id="end" hidden>
      <div class="big-emoji">🎉</div>
      <h1>Well done!</h1>
      <p id="end-message"></p>
      <button class="big-btn" id="again-btn" type="button">Play again</button>
    </div>
    <div class="big-screen-row">
      <button type="button" data-big-screen>Big screen</button>
    </div>
    <nav class="links">
      <a class="link-btn" id="back-btn" href="explorers.html">Back</a>
      <a class="link-btn" href="index.html">Home</a>
    </nav>
  </main>
  <script src="topics.js"></script>
  <script src="voice.js"></script>
  <script src="bigscreen.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const cards = TOPICS.explorers.cards;
    let queue = [];
    let index = 0;
    let right = 0;
    let answered = false;

    function shuffled(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
    function show(id) {
      for (const panel of ["setup", "play", "end"]) {
        $(panel).hidden = panel !== id;
      }
    }
    function say(text) {
      if (Voice.supported) Voice.speak(text);
    }
    function showCard() {
      const card = queue[index];
      answered = false;
      $("pic").src = card.picture;
      $("pic").alt = card.word;
      $("name").textContent = card.word;
      $("progress").textContent = (index + 1) + " / " + queue.length;
      $("explain").textContent = "";
      $("next-btn").hidden = true;
      for (const button of document.querySelectorAll(".choices button")) {
        button.disabled = false;
        button.classList.remove("right", "wrong");
      }
      say("Is the " + card.word + " an insect, or another bug?");
    }
    function choose(isInsect) {
      if (answered) return;
      answered = true;
      const card = queue[index];
      const correct = card.insect === isInsect;
      const chosen = isInsect ? $("insect-btn") : $("bug-btn");
      const answer = card.insect ? $("insect-btn") : $("bug-btn");
      if (correct) {
        right++;
        chosen.classList.add("right");
        const text = card.insect
          ? "Yes! A " + card.word + " is an insect. It has 6 legs and 3 body parts."
          : "Yes! A " + card.word + " is a bug, but not an insect.";
        $("explain").textContent = text;
        say(text);
      } else {
        chosen.classList.add("wrong");
        answer.classList.add("right");
        const text = card.insect
          ? "Not quite. A " + card.word + " is an insect, with 6 legs and 3 body parts."
          : "Not quite. A " + card.word + " is a bug, but not an insect.";
        $("explain").textContent = text;
        say(text);
      }
      for (const button of document.querySelectorAll(".choices button")) button.disabled = true;
      $("next-btn").hidden = false;
      $("next-btn").textContent = index === queue.length - 1 ? "See my score" : "Next";
    }
    function nextCard() {
      index++;
      if (index >= queue.length) {
        finish();
      } else {
        showCard();
      }
    }
    function finish() {
      show("end");
      $("end-message").textContent = "You got " + right + " of " + queue.length + " right.";
      say("You got " + right + " of " + queue.length + " right!");
    }
    function startGame() {
      queue = shuffled(cards);
      index = 0;
      right = 0;
      show("play");
      showCard();
    }

    $("start-btn").addEventListener("click", startGame);
    $("again-btn").addEventListener("click", startGame);
    $("insect-btn").addEventListener("click", () => choose(true));
    $("bug-btn").addEventListener("click", () => choose(false));
    $("next-btn").addEventListener("click", nextCard);
    // Back returns to the page the child came from, not always the topic page
    $("back-btn").addEventListener("click", event => {
      if (history.length > 1) {
        event.preventDefault();
        history.back();
      }
    });
  </script>
  <script src="pwa.js"></script>
</body>
</html>
