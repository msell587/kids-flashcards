<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printable Worksheets</title>
  <meta name="theme-color" content="#2f6f9f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="game.css">
  <style>
    /* Printable worksheets: sheets are grouped by topic; each sheet is a card with a download link and a print link */
    .sheet-group {
      width: min(94vw, 900px);
      margin: 24px auto 0 auto;
    }
    .sheet-group h2.group-title {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      color: var(--word-dark);
      text-align: left;
    }
    .sheet-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin: 12px 0 0 0;
    }
    .sheet-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px;
      border-radius: 22px;
      background-color: var(--surface);
      color: var(--word-dark);
      box-shadow: var(--shadow);
      text-align: left;
    }
    .sheet-card h3 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }
    .sheet-card p {
      margin: 0;
      font-size: 16px;
    }
    .sheet-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }
    .sheet-actions a {
      padding: 10px 18px;
      border-radius: 999px;
      background-color: var(--word);
      color: #fff;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
    }
    .sheet-actions a.secondary {
      background-color: #fff;
      color: var(--word);
      border: 2px solid var(--word);
    }
  </style>
</head>
<body>
  <div class="bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <main>
    <h1>Printable Worksheets</h1>
    <p>Download a sheet, or open it to print straight away. Sheets are grouped by topic.</p>
    <div id="sheets"></div>
    <nav class="links">
      <a class="link-btn" href="index.html">Home</a>
    </nav>
  </main>
  <script>
    // Every printable sheet, listed once. "file" is in printables/worksheets/.
    const SHEET_GROUPS = [
      { title: "Feelings", sheets: [
        { title: "Basic Emotions", file: "basic-emotions.pdf", note: "Learn and match the basic feelings, 1 page." },
        { title: "Matching Emotions", file: "matching-emotions.pdf" },
        { title: "SEL Emotions", file: "sel-emotions.pdf" },
        { title: "Express Your Feelings Colouring", file: "express-your-feelings-colouring.pdf", note: "Colour in the faces and talk about how you feel, 1 page." },
        { title: "Feelings Colouring Page", file: "feelings-colouring.pdf", note: "Six cartoon faces on one A4 page: happy, sad, angry, scared, surprised and sleepy." },
        { title: "Feelings Colouring Page: Boxes", file: "feelings-colouring-boxes.pdf", note: "Twelve cartoon faces in boxes, with big expressions, on one A4 page." }
      ] },
      { title: "Shapes and maths", sheets: [
        { title: "Tracing Shapes", file: "tracing-shapes.pdf", note: "Trace and match the shapes, 6 pages." },
        { title: "Simple Shapes Tracing", file: "simple-shapes-tracing.pdf" },
        { title: "Shapes Math Games", file: "shapes-math-games.pdf" },
        { title: "Shape Patterns", file: "shape-patterns.pdf" }
      ] },
      { title: "Letters and writing", sheets: [
        { title: "Trace the Letter", file: "trace-the-letter.pdf", note: "Letter tracing practice, 26 pages." },
        { title: "Pre-Writing Tracing", file: "pre-writing-tracing.pdf" }
      ] },
      { title: "Seasons", sheets: [
        { title: "Spring colouring", path: "images/coloring-sheets/spring.pdf" },
        { title: "Summer colouring", path: "images/coloring-sheets/summer.pdf" },
        { title: "Autumn colouring", path: "images/coloring-sheets/autumn.pdf" },
        { title: "Winter colouring", path: "images/coloring-sheets/winter.pdf" }
      ] },
      { title: "Weather", sheets: [
        { title: "Weather colouring", path: "images/coloring-sheets/weather.pdf" },
        { title: "Hot and cold colouring", path: "images/coloring-sheets/hot and cold.pdf" }
      ] },
      { title: "My House", sheets: [
        { title: "My House colouring", path: "images/coloring-sheets/my house.pdf" }
      ] },
      { title: "City", sheets: [
        { title: "City colouring", path: "images/coloring-sheets/city.pdf" }
      ] },
      { title: "Christmas", sheets: [
        { title: "Christmas colouring", path: "images/coloring-sheets/christmas.pdf" }
      ] },
      { title: "My Little Garden", sheets: [
        { title: "My Little Garden colouring", path: "images/coloring-sheets/my little garden.pdf" }
      ] },
      { title: "Animals", sheets: [
        { title: "Animals colouring", path: "images/coloring-sheets/animals.pdf" },
        { title: "On the Farm Colouring", file: "on-the-farm-colouring.pdf" },
        { title: "Snake Cards", file: "snake-cards.pdf" }
      ] },
      { title: "Colouring and matching", sheets: [
        { title: "Simple Colouring", file: "simple-colouring.pdf" },
        { title: "Matching Exercise", file: "matching-exercise.pdf" }
      ] }
    ];

    const container = document.getElementById("sheets");
    container.innerHTML = SHEET_GROUPS.map(group => `
      <section class="sheet-group">
        <h2 class="group-title">${group.title}</h2>
        <div class="sheet-list">
          ${group.sheets.map(sheet => {
            const path = encodeURI(sheet.path || "printables/worksheets/" + sheet.file);
            return `
          <article class="sheet-card">
            <h3>${sheet.title}</h3>
            ${sheet.note ? `<p>${sheet.note}</p>` : ""}
            <nav class="sheet-actions">
              <a href="${path}" download="${sheet.title}.pdf">Download PDF</a>
              <a class="secondary" href="${path}" target="_blank" rel="noopener">Open to print</a>
            </nav>
          </article>`;
          }).join("")}
        </div>
      </section>`).join("");
  </script>
</body>
</html>
