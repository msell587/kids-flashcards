name = "sheet-gate"
main = "index.js"
compatibility_date = "2026-01-01"

# Private bucket holding the coloring sheets. Keys are the file paths, e.g. images/coloring-sheets/spring.pdf
[[r2_buckets]]
binding = "SHEETS"
bucket_name = "coloring-sheets"

# Sites allowed to call the Worker from a browser (no slash at the end)
[vars]
ALLOWED_ORIGINS = "https://msell587.github.io,http://localhost:5173"

# Set the teacher codes as a secret, never in this file:
#   npx wrangler secret put TEACHER_CODES
