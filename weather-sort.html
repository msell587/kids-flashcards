<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Sort</title>
  <meta name="theme-color" content="#2f6f9f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="game.css">
  <style>
    /* Weather Sort: tap a picture, then tap its weather word */
    .pic-stage {
      display: flex;
      justify-content: center;
      height: min(36vh, 280px);
      margin: 12px 0 8px 0;
    }
    .pic {
      height: 100%;
      max-width: 92vw;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 24px;
      background-color: #fff;
      box-shadow: var(--shadow);
      border: 6px solid #fff;
      box-sizing: border-box;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .pic.dragging {
      cursor: grabbing;
      box-shadow: var(--shadow-lift);
    }
    .pic.selected {
      border-color: var(--word-dark);
    }
    .pic.fit {
      transition: transform 0.15s;
    }
    .pic.placed {
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.4s, transform 0.4s;
    }
    .bins {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: min(94vw, 720px);
      margin: 14px auto 0 auto;
    }
    .bin {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 10px 4px;
      background-color: var(--surface);
      border: 4px dashed var(--word);
      border-radius: 20px;
      color: var(--word-dark);
      font-family: var(--font);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.15s;
    }
    .bin.hover {
      background-color: #e3f1ff;
      transform: scale(1.06);
    }
    .bin.right {
      background-color: #d9f5df;
      border-style: solid;
    }
    .bin.wrong {
      animation: shake 0.4s;
    }
    .bin-emoji {
      font-size: 30px;
      line-height: 1;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .game-feedback {
      min-height: 28px;
      margin: 10px 0 0 0;
      font-size: 22px;
      font-weight: 800;
      color: var(--word-dark);
      text-align: center;
    }
    @media (max-width: 500px) {
      .bins {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .bin.wrong { animation: none; }
      .pic.placed { transition: none; }
    }
    /* Shuffle on or off before the game starts */
    .shuffle-btn {
      margin-top: 12px;
      padding: 10px 22px;
      border: 2px solid var(--word);
      border-radius: 999px;
      background: #fff;
      color: var(--word);
      font-family: var(--font);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <main>
    <div class="panel" id="start">
      <div class="big-emoji">🌦️</div>
      <h1>Weather Sort</h1>
      <p>Tap a picture, then tap its weather.</p>
      <button class="big-btn" id="start-btn">Start</button>
      <br>
      <button class="shuffle-btn" id="shuffle-btn" type="button" aria-pressed="true">Shuffle: on</button>
    </div>

    <div id="play" hidden>
      <div class="top-row">
        <span id="progress"></span>
        <span id="score" aria-label="Stars"></span>
      </div>
      <div class="pic-stage">
        <img class="pic" id="pic" alt="" draggable="false">
      </div>
      <p class="game-feedback" id="feedback" aria-live="polite"></p>
      <div class="bins" id="bins"></div>
    </div>

    <div class="panel" id="end" hidden>
      <div class="big-emoji">🎉</div>
      <h1>Well done!</h1>
      <p id="end-message"></p>
      <button class="big-btn" id="again-btn">Play again</button>
    </div>

    <nav class="links">
      <a class="link-btn" id="back-btn" href="teacher.html?topic=weather">Back</a>
      <a class="link-btn" href="index.html">Home</a>
    </nav>
  </main>

  <script src="topics.js"></script>
  <script src="voice.js"></script>
  <script>
    // One picture-bin for each weather word
    const EMOJI = { sunny: "☀️", rainy: "🌧️", cloudy: "☁️", snowy: "❄️", windy: "💨", stormy: "⛈️", hot: "🥵", cold: "🥶" };
    const cards = TOPICS.weather.cards;
    const canSpeak = Voice.supported;

    const pic = document.getElementById("pic");
    const feedback = document.getElementById("feedback");
    const binsEl = document.getElementById("bins");

    let queue = [];
    let index = 0;
    let firstTry = 0;
    let missedThisPicture = false;
    let busy = false;
    let selected = false;

    function say(text) {
      if (canSpeak) Voice.speak(text);
    }

    function show(id) {
      for (const panel of ["start", "play", "end"]) {
        document.getElementById(panel).hidden = panel !== id;
      }
    }

    // Build one bin per weather word, once
    binsEl.innerHTML = cards.map(card =>
      `<button class="bin" data-word="${card.word}" aria-label="${card.word}">` +
        `<span class="bin-emoji" aria-hidden="true">${EMOJI[card.word]}</span>` +
        `<span>${card.word}</span></button>`
    ).join("");
    const bins = [...binsEl.querySelectorAll(".bin")];

    function shuffled(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Shuffle is on by default; when it is off the pictures come in the order of the topic
    const shuffleButton = document.getElementById("shuffle-btn");
    shuffleButton.addEventListener("click", () => {
      const on = shuffleButton.getAttribute("aria-pressed") !== "true";
      shuffleButton.setAttribute("aria-pressed", on);
      shuffleButton.textContent = on ? "Shuffle: on" : "Shuffle: off";
    });

    function startGame() {
      const shuffle = shuffleButton.getAttribute("aria-pressed") === "true";
      queue = shuffle ? shuffled(cards) : [...cards];
      index = 0;
      firstTry = 0;
      show("play");
      showPicture();
    }

    function showPicture() {
      const card = queue[index];
      missedThisPicture = false;
      busy = false;
      selected = false;
      pic.className = "pic";
      pic.style.transform = "";
      pic.src = encodeURI(gamePicture(card));
      pic.alt = card.word;
      feedback.textContent = "Which weather is this?";
      bins.forEach(bin => bin.className = "bin");
      document.getElementById("progress").textContent = (index + 1) + " / " + queue.length;
      document.getElementById("score").textContent = "⭐".repeat(firstTry);
      say("Which weather is this?");
    }

    function answer(word) {
      if (busy) return;
      busy = true;
      const card = queue[index];
      selected = false;
      pic.classList.remove("selected");
      const bin = bins.find(b => b.dataset.word === word);

      if (word === card.word) {
        if (!missedThisPicture) firstTry++;
        bin.classList.add("right");
        pic.classList.add("placed");
        feedback.textContent = "Yes! It's " + card.word + "!";
        // Move on first, so a speech problem can never leave the game stuck on this picture
        setTimeout(() => {
          index++;
          if (index >= queue.length) {
            finish();
          } else {
            pic.classList.remove("placed");
            showPicture();
          }
        }, 1300);
        say("Yes! It's " + card.word + "!");
      } else {
        missedThisPicture = true;
        busy = false;
        bin.classList.add("wrong");
        feedback.textContent = "Not quite. Try another one.";
        say("Not quite. Try another one.");
        setTimeout(() => bin.classList.remove("wrong"), 450);
      }
    }

    function finish() {
      show("end");
      const message = "You got " + firstTry + " of " + queue.length + " right the first time.";
      document.getElementById("end-message").textContent = message;
      say("Well done! " + message);
    }

    // Dragging with a finger, pen or mouse
    // Tap a picture to pick it up, then tap its weather box
    pic.addEventListener("click", () => {
      if (busy) return;
      selected = !selected;
      pic.classList.toggle("selected", selected);
      feedback.textContent = selected ? "Now tap the weather." : "Which weather is this?";
    });

    binsEl.addEventListener("click", (event) => {
      const bin = event.target.closest(".bin");
      if (!bin || busy) return;
      if (!selected) {
        feedback.textContent = "Tap the picture first.";
        return;
      }
      answer(bin.dataset.word);
    });

    document.getElementById("start-btn").addEventListener("click", startGame);
    document.getElementById("again-btn").addEventListener("click", startGame);

    // Back returns to the page the teacher came from, not to Home
    document.getElementById("back-btn").addEventListener("click", event => {
      if (history.length > 1) {
        event.preventDefault();
        history.back();
      }
    });
  </script>
  <script src="pwa.js"></script>
</body>
</html>
