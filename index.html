<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let's Learn! Flashcards</title>
  <meta name="theme-color" content="#2f6f9f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px 28px 16px;
      box-sizing: border-box;
      color: var(--text);
    }
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo {
      width: 76px;
      height: 76px;
      display: block;
      margin: 0 auto 10px auto;
      filter: drop-shadow(0 6px 12px rgba(47, 111, 159, 0.25));
      animation: float 3.5s ease-in-out infinite;
    }
    h1 {
      color: var(--word);
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
    }
    .tagline {
      margin: 4px 0 0 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--muted);
    }
    .topics {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 22px;
      width: min(100%, 860px);
    }
    /* Big screens (computer, TV): bigger tiles and photos */
    @media (min-width: 900px) {
      .topics {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 28px;
        width: min(100%, 1120px);
      }
      .tile {
        font-size: 26px;
        padding: 14px 14px 18px 14px;
      }
      .tile img {
        border-radius: 24px;
      }
    }
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 10px 10px 14px 10px;
      background-color: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      color: var(--word);
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      /* "backwards" so the hover lift still works once the tile has arrived */
      animation: rise-in 0.5s ease-out backwards;
      animation-delay: calc(var(--i, 0) * 70ms);
    }
    .tile img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 20px;
      background-color: var(--tile-color, var(--soft-blue));
      margin-bottom: 10px;
    }
    .tile[data-topic="animals"] { --tile-color: var(--animals); }
    .tile[data-topic="colors"] { --tile-color: var(--colors); }
    .tile[data-topic="shapes"] { --tile-color: var(--shapes); }
    .tile[data-topic="house"] { --tile-color: var(--house); }
    .tile[data-topic="seasons"] { --tile-color: var(--seasons); }
    .tile[data-topic="weather"] { --tile-color: var(--weather); }
    .tile[data-topic="opposites"] { --tile-color: var(--opposites); }
    .tile[data-topic="city"] { --tile-color: var(--city); }
    .tile[data-topic="christmas"] { --tile-color: var(--christmas); }
    .tile[data-topic="garden"] { --tile-color: var(--garden); }
    .tile[data-topic="madrid"] { --tile-color: var(--madrid); }
    .tile[data-topic="feelings"] { --tile-color: #e4f1f7; }
    .tile[data-topic="explorers"] { --tile-color: #e8f4e0; }
    .tile[data-topic="transport"] { --tile-color: #e4eef8; }
    .tile[data-topic="community"] { --tile-color: #fdeedd; }
    .tile[data-topic="toys"] { --tile-color: #e9f5e4; }
    /* Special tile: a photo that fills the frame and a red-and-yellow "Special" ribbon */
    .tile.special {
      border: 4px solid #f2b705;
    }
    .tile.special img {
      object-fit: cover;
      padding: 0;
    }
    .ribbon {
      position: absolute;
      top: 18px;
      left: 0;
      padding: 4px 12px 4px 10px;
      font-size: 14px;
      color: #fff;
      background-color: #c8102e;
      border-radius: 0 999px 999px 0;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
    }
    .tile span {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
    }
    .tile:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lift);
    }
    .tile:hover img {
      animation: wiggle 0.5s ease-in-out;
    }
    .tile:active {
      transform: translateY(1px);
      box-shadow: var(--shadow);
    }
    .tile:focus-visible {
      outline: 4px solid var(--word);
      outline-offset: 4px;
    }
    /* Small and quiet, so it does not look like a button for children; press and hold to open */
    .grownup {
      margin-top: 32px;
      padding: 7px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      background-color: transparent;
      border: 2px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: background-color 0.2s, color 0.2s;
    }
    .grownup.holding {
      color: white;
      background-color: var(--word);
      border-color: var(--word);
    }
    .grownup:focus-visible {
      outline: 3px solid var(--word);
      outline-offset: 3px;
    }
    .grownup-hint {
      margin: 6px 0 0 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    /* Star sticker on topics a child has finished */
    .star {
      position: absolute;
      top: -14px;
      right: -10px;
      font-size: 34px;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.2));
      animation: star-pop 0.5s ease-out;
    }
    @keyframes star-pop {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
    .clear-stars {
      margin-top: 12px;
      font-family: inherit;
      font-size: 15px;
      color: var(--muted);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
    }
    /* The title letters arrive one at a time */
    .brand h1 .letter {
      display: inline-block;
      animation: letter-in 0.5s ease-out backwards;
    }
    @keyframes letter-in {
      from { opacity: 0; transform: translateY(-16px) scale(0.7); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .star {
        animation: none;
      }
      .tile,
      .grownup {
        transition: none;
      }
      .brand h1 .letter {
        animation: none;
      }
    }
    /* Phones: two tiles per row */
    @media (max-width: 500px) {
      body {
        padding-top: 22px;
      }
      .logo {
        width: 60px;
        height: 60px;
      }
      h1 {
        font-size: 40px;
      }
      .tagline {
        font-size: 16px;
      }
      .topics {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .tile {
        font-size: 18px;
        border-radius: 22px;
        padding: 8px 8px 12px 8px;
      }
      .tile img {
        border-radius: 16px;
        padding: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <header class="brand">
    <img class="logo" src="icons/icon.svg" alt="">
    <h1 id="wordmark">Let's Learn!</h1>
    <p class="tagline">English flashcards for little learners</p>
  </header>
  <script>
    // Split the title into letters so each one animates in on its own
    const wordmark = document.getElementById("wordmark");
    const title = wordmark.textContent;
    wordmark.setAttribute("aria-label", title);
    wordmark.innerHTML = [...title].map((letter, i) =>
      `<span class="letter" aria-hidden="true" style="animation-delay:${i * 0.09}s">${letter === " " ? "&nbsp;" : letter}</span>`
    ).join("");
  </script>
  <div class="topics">
    <a class="tile" href="animals.html" data-topic="animals">
      <img src="images/animals/elephant.jpg" alt="">
      <span>Animals</span>
    </a>
    <a class="tile" href="colors.html" data-topic="colors">
      <img src="images/colors/red.jpg" alt="">
      <span>Colours</span>
    </a>
    <a class="tile" href="shapes.html" data-topic="shapes">
      <img src="images/shapes/circle.jpg" alt="">
      <span>Shapes</span>
    </a>
    <a class="tile" href="house.html" data-topic="house">
      <img src="images/house/house.jpg" alt="">
      <span>My House</span>
    </a>
    <a class="tile" href="seasons.html" data-topic="seasons">
      <img src="images/seasons and weather/autumn.jpg" alt="">
      <span>Seasons</span>
    </a>
    <a class="tile" href="weather.html" data-topic="weather">
      <img src="images/seasons and weather/sunny.jpg" alt="">
      <span>Weather</span>
    </a>
    <a class="tile" href="opposites.html" data-topic="opposites">
      <img src="images/seasons and weather/wet.jpg" alt="">
      <span>Opposites</span>
    </a>
    <a class="tile" href="city.html" data-topic="city">
      <img src="images/city/city.jpg" alt="">
      <span>City</span>
    </a>
    <a class="tile" href="christmas.html" data-topic="christmas">
      <img src="images/christmas/santa.jpg" alt="">
      <span>Christmas</span>
    </a>
    <a class="tile" href="garden.html" data-topic="garden">
      <img src="images/garden/flower.jpg" alt="">
      <span>My Little Garden</span>
    </a>
    <a class="tile" href="feelings.html" data-topic="feelings">
      <img src="images/feelings/happy.jpg" alt="">
      <span>Feelings</span>
    </a>
    <a class="tile" href="explorers.html" data-topic="explorers">
      <img src="images/garden/butterfly.jpg" alt="">
      <span>Animal Explorers</span>
    </a>
    <a class="tile" href="transport.html" data-topic="transport">
      <img src="images/city/bus.jpg" alt="">
      <span>On the Move</span>
    </a>
    <a class="tile" href="community.html" data-topic="community">
      <img src="images/community-helpers/doctor.jpg" alt="">
      <span>Community Helpers</span>
    </a>
    <a class="tile" href="toys.html" data-topic="toys">
      <img src="images/toys/kite.jpg" alt="">
      <span>Toy Makers</span>
    </a>
    <a class="tile special" href="madrid.html" data-topic="madrid">
      <img src="images/madrid/madrid.jpg" alt="">
      <span>Madrid</span>
      <b class="ribbon">Special</b>
    </a>
  </div>
  <button class="grownup" id="grownup" type="button">For grown-ups</button>
  <p class="grownup-hint">Press and hold to open</p>
  <p class="grownup-hint"><a href="privacy.html">Privacy</a> · <a href="printables.html">Printable sheets</a></p>
  <button class="clear-stars" id="clear-stars" hidden>↺ Clear stars</button>

  <script>
    // Show a ⭐ on each topic the child has finished (saved by flashcards.js)
    let finishedTopics = [];
    try {
      finishedTopics = JSON.parse(localStorage.getItem("finished-topics") || "[]");
    } catch (error) {
      // No stars in this browser
    }
    if (!Array.isArray(finishedTopics)) finishedTopics = [];
    document.querySelectorAll(".tile").forEach((tile, index) => {
      tile.style.setProperty("--i", index);
      if (finishedTopics.includes(tile.dataset.topic)) {
        tile.insertAdjacentHTML("beforeend", '<span class="star" aria-label="Finished">⭐</span>');
      }
    });

    // The grown-ups' area opens only after a press-and-hold of two seconds,
    // so a small child tapping the home screen does not land in it by accident
    const grownUp = document.getElementById("grownup");
    let holdTimer = null;
    function startHold(event) {
      if (event.type === "keydown") {
        if (event.key !== "Enter" && event.key !== " ") return;
        if (event.repeat) return;
        event.preventDefault();
      }
      grownUp.classList.add("holding");
      holdTimer = setTimeout(() => { location.href = "teacher.html"; }, 2000);
    }
    function cancelHold() {
      clearTimeout(holdTimer);
      grownUp.classList.remove("holding");
    }
    grownUp.addEventListener("pointerdown", startHold);
    grownUp.addEventListener("keydown", startHold);
    ["pointerup", "pointerleave", "pointercancel", "keyup", "blur"].forEach(name =>
      grownUp.addEventListener(name, cancelHold));
    grownUp.addEventListener("click", event => event.preventDefault());
    grownUp.addEventListener("contextmenu", event => event.preventDefault());

    const clearButton = document.getElementById("clear-stars");
    clearButton.hidden = finishedTopics.length === 0;
    clearButton.addEventListener("click", () => {
      if (!confirm("Clear all the stars on this device? (Useful for a new class.)")) return;
      try {
        localStorage.removeItem("finished-topics");
      } catch (error) {}
      document.querySelectorAll(".star").forEach(star => star.remove());
      clearButton.hidden = true;
    });
  </script>
  <script src="pwa.js"></script>
</body>
</html>
