<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcards</title>
  <style>
    :root {
      --background: #f4faf0;
      --border: #6bcb77;
      --word: #3a7ca5;
    }
    body {
      font-family: "Trebuchet MS", Arial, sans-serif;
      background-color: var(--background);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    h1 {
      color: var(--word);
      font-size: 48px;
      margin: 0 0 28px 0;
    }
    .topics {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 700px;
    }
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 200px;
      box-sizing: border-box;
      padding: 12px 12px 14px 12px;
      background-color: white;
      border: 6px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      color: var(--word);
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .tile img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      margin-bottom: 8px;
    }
    .tile span {
      flex: 1;
      display: flex;
      align-items: center;
    }
    .tile:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.14);
    }
    .tile:active {
      transform: translateY(1px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
    }
    .tile:focus-visible {
      outline: 3px solid var(--word);
      outline-offset: 3px;
    }
    .teacher-link {
      margin-top: 28px;
      font-size: 18px;
      color: var(--word);
    }
    /* Star sticker on topics a child has finished */
    .star {
      position: absolute;
      top: -14px;
      right: -14px;
      font-size: 34px;
      animation: star-pop 0.5s ease-out;
    }
    @keyframes star-pop {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
    .clear-stars {
      margin-top: 10px;
      font-family: inherit;
      font-size: 15px;
      color: var(--word);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      opacity: 0.8;
    }
    @media (prefers-reduced-motion: reduce) {
      .star {
        animation: none;
      }
    }
    /* Phones: two tiles per row */
    @media (max-width: 500px) {
      h1 {
        font-size: 40px;
      }
      .topics {
        gap: 14px;
      }
      .tile {
        width: calc(50% - 7px);
        font-size: 20px;
        border-width: 5px;
      }
    }
  </style>
</head>
<body>
  <h1>Let's Learn!</h1>
  <div class="topics">
    <a class="tile" href="animals.html" data-topic="animals">
      <img src="images/animals/elephant.jpg" alt="">
      <span>Animals</span>
    </a>
    <a class="tile" href="colors.html" data-topic="colors">
      <img src="images/colors/red-apple.jpg" alt="">
      <span>Colors</span>
    </a>
    <a class="tile" href="shapes.html" data-topic="shapes">
      <img src="images/shapes/circle.jpg" alt="">
      <span>Shapes</span>
    </a>
    <a class="tile" href="house.html" data-topic="house">
      <img src="images/house/house.jpg" alt="">
      <span>My House</span>
    </a>
    <a class="tile" href="seasons and weather.html" data-topic="seasons">
      <img src="images/seasons and weather/summer.jpg" alt="">
      <span>Seasons and Weather</span>
    </a>
  </div>
  <a class="teacher-link" href="teacher.html">📋 Teacher's corner</a>
  <button class="clear-stars" id="clear-stars" hidden>↺ Clear stars</button>

  <script>
    // Show a ⭐ on each topic the child has finished (saved by flashcards.js)
    let finishedTopics = [];
    try {
      finishedTopics = JSON.parse(localStorage.getItem("finished-topics") || "[]");
    } catch (error) {
      // No stars in this browser
    }
    document.querySelectorAll(".tile").forEach(tile => {
      if (finishedTopics.includes(tile.dataset.topic)) {
        tile.insertAdjacentHTML("beforeend", '<span class="star" aria-label="Finished">⭐</span>');
      }
    });

    const clearButton = document.getElementById("clear-stars");
    clearButton.hidden = finishedTopics.length === 0;
    clearButton.addEventListener("click", () => {
      if (!confirm("Clear all the stars on this device? (Useful for a new class.)")) return;
      try {
        localStorage.removeItem("finished-topics");
      } catch (error) {}
      document.querySelectorAll(".star").forEach(star => star.remove());
      clearButton.hidden = true;
    });
  </script>
</body>
</html>
