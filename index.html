<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let's Learn! Flashcards</title>
  <meta name="theme-color" content="#2f6f9f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="theme.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px 28px 16px;
      box-sizing: border-box;
      color: var(--text);
    }
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo {
      width: 76px;
      height: 76px;
      display: block;
      margin: 0 auto 10px auto;
      filter: drop-shadow(0 6px 12px rgba(47, 111, 159, 0.25));
      animation: float 3.5s ease-in-out infinite;
    }
    h1 {
      color: var(--word);
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
    }
    .tagline {
      margin: 4px 0 0 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--muted);
    }
    .topics {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 22px;
      width: min(100%, 860px);
    }
    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 10px 10px 14px 10px;
      background-color: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      color: var(--word);
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      transition: transform 0.15s, box-shadow 0.15s;
      /* "backwards" so the hover lift still works once the tile has arrived */
      animation: rise-in 0.5s ease-out backwards;
      animation-delay: calc(var(--i, 0) * 70ms);
    }
    .tile img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 20px;
      background-color: var(--tile-color, var(--soft-blue));
      margin-bottom: 10px;
    }
    .tile[data-topic="animals"] { --tile-color: var(--animals); }
    .tile[data-topic="colors"] { --tile-color: var(--colors); }
    .tile[data-topic="shapes"] { --tile-color: var(--shapes); }
    .tile[data-topic="house"] { --tile-color: var(--house); }
    .tile[data-topic="seasons"] { --tile-color: var(--seasons); }
    .tile[data-topic="city"] { --tile-color: var(--city); }
    .tile[data-topic="christmas"] { --tile-color: var(--christmas); }
    .tile-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      color: inherit;
      text-decoration: none;
      border-radius: 20px;
    }
    .tile-main span {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
    }
    .tile:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lift);
    }
    .tile:hover img {
      animation: wiggle 0.5s ease-in-out;
    }
    .tile:active {
      transform: translateY(1px);
      box-shadow: var(--shadow);
    }
    .tile-main:focus-visible {
      outline: 4px solid var(--word);
      outline-offset: 4px;
    }
    /* Each tile's Lesson plan button, under the topic name */
    .tile-plan {
      margin-top: 10px;
      padding: 6px 12px;
      font-size: 15px;
      font-weight: 800;
      color: var(--word);
      background-color: var(--soft-blue);
      border-radius: 999px;
      text-decoration: none;
      transition: background-color 0.15s;
    }
    .tile-plan:hover {
      background-color: #d6e8f6;
    }
    .tile-plan:focus-visible {
      outline: 3px solid var(--word);
      outline-offset: 3px;
    }
    .teacher-link {
      margin-top: 32px;
      padding: 10px 22px;
      font-size: 18px;
      font-weight: 700;
      color: var(--word);
      background-color: var(--surface);
      border-radius: 999px;
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .teacher-link:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lift);
    }
    .teacher-link:focus-visible {
      outline: 3px solid var(--word);
      outline-offset: 3px;
    }
    /* Star sticker on topics a child has finished */
    .star {
      position: absolute;
      top: -14px;
      right: -10px;
      font-size: 34px;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.2));
      animation: star-pop 0.5s ease-out;
    }
    @keyframes star-pop {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
    .clear-stars {
      margin-top: 12px;
      font-family: inherit;
      font-size: 15px;
      color: var(--muted);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) {
      .star {
        animation: none;
      }
      .tile,
      .teacher-link {
        transition: none;
      }
    }
    /* Phones: two tiles per row */
    @media (max-width: 500px) {
      body {
        padding-top: 22px;
      }
      .logo {
        width: 60px;
        height: 60px;
      }
      h1 {
        font-size: 40px;
      }
      .tagline {
        font-size: 16px;
      }
      .topics {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .tile {
        font-size: 18px;
        border-radius: 22px;
        padding: 8px 8px 12px 8px;
      }
      .tile img {
        border-radius: 16px;
        padding: 6px;
      }
      .tile-plan {
        margin-top: 8px;
        padding: 5px 8px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="bubbles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <header class="brand">
    <img class="logo" src="icons/icon.svg" alt="">
    <h1>Let's Learn!</h1>
    <p class="tagline">English flashcards for little learners</p>
  </header>
  <div class="topics">
    <div class="tile" data-topic="animals">
      <a class="tile-main" href="animals.html">
        <img src="images/animals/elephant.jpg" alt="">
        <span>Animals</span>
      </a>
      <a class="tile-plan" href="teacher.html?topic=animals" aria-label="Animals lesson plan">📋 Lesson plan</a>
    </div>
    <div class="tile" data-topic="colors">
      <a class="tile-main" href="colors.html">
        <img src="images/colors/red-apple.jpg" alt="">
        <span>Colors</span>
      </a>
      <a class="tile-plan" href="teacher.html?topic=colors" aria-label="Colors lesson plan">📋 Lesson plan</a>
    </div>
    <div class="tile" data-topic="shapes">
      <a class="tile-main" href="shapes.html">
        <img src="images/shapes/circle.jpg" alt="">
        <span>Shapes</span>
      </a>
      <a class="tile-plan" href="teacher.html?topic=shapes" aria-label="Shapes lesson plan">📋 Lesson plan</a>
    </div>
    <div class="tile" data-topic="house">
      <a class="tile-main" href="house.html">
        <img src="images/house/house.jpg" alt="">
        <span>My House</span>
      </a>
      <a class="tile-plan" href="teacher.html?topic=house" aria-label="My House lesson plan">📋 Lesson plan</a>
    </div>
    <div class="tile" data-topic="seasons">
      <a class="tile-main" href="seasons and weather.html">
        <img src="images/seasons and weather/summer.jpg" alt="">
        <span>Seasons and Weather</span>
      </a>
      <a class="tile-plan" href="teacher.html?topic=seasons" aria-label="Seasons and Weather lesson plan">📋 Lesson plan</a>
    </div>
    <div class="tile" data-topic="city">
      <a class="tile-main" href="city.html">
        <img src="images/city/city.jpg" alt="">
        <span>City</span>
      </a>
      <a class="tile-plan" href="teacher.html?topic=city" aria-label="City lesson plan">📋 Lesson plan</a>
    </div>
    <div class="tile" data-topic="christmas">
      <a class="tile-main" href="christmas.html">
        <img src="images/christmas/santa.svg" alt="">
        <span>Christmas</span>
      </a>
      <a class="tile-plan" href="teacher.html?topic=christmas" aria-label="Christmas lesson plan">📋 Lesson plan</a>
    </div>
  </div>
  <a class="teacher-link" href="teacher.html">📋 Teacher's corner</a>
  <button class="clear-stars" id="clear-stars" hidden>↺ Clear stars</button>

  <script>
    // Show a ⭐ on each topic the child has finished (saved by flashcards.js)
    let finishedTopics = [];
    try {
      finishedTopics = JSON.parse(localStorage.getItem("finished-topics") || "[]");
    } catch (error) {
      // No stars in this browser
    }
    document.querySelectorAll(".tile").forEach((tile, index) => {
      tile.style.setProperty("--i", index);
      if (finishedTopics.includes(tile.dataset.topic)) {
        tile.insertAdjacentHTML("beforeend", '<span class="star" aria-label="Finished">⭐</span>');
      }
    });

    const clearButton = document.getElementById("clear-stars");
    clearButton.hidden = finishedTopics.length === 0;
    clearButton.addEventListener("click", () => {
      if (!confirm("Clear all the stars on this device? (Useful for a new class.)")) return;
      try {
        localStorage.removeItem("finished-topics");
      } catch (error) {}
      document.querySelectorAll(".star").forEach(star => star.remove());
      clearButton.hidden = true;
    });
  </script>
  <script src="pwa.js"></script>
</body>
</html>
