<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Animal Flashcards (Print)</title>
  <style>
    @page {
      size: A4;
      margin: 10mm;
    }
    body {
      font-family: "Trebuchet MS", Arial, sans-serif;
      margin: 0;
    }
    .sheet {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6mm;
    }
    .card {
      border: 1px dashed #999;
      height: 85mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      break-inside: avoid;
    }
    .card img {
      width: 100%;
      height: 60mm;
      object-fit: contain;
    }
    .card h2 {
      margin: 4mm 0 0 0;
      font-size: 22pt;
      color: #3a7ca5;
    }
    @media screen {
      body { padding: 20px; background: #f4faf0; }
    }
  </style>
</head>
<body>
  <div class="sheet" id="sheet"></div>

  <script>
    const cards = [
      { word: "ant", picture: "images/animals/ant.jpg" },
      { word: "elephant", picture: "images/animals/elephant.jpg" },
      { word: "giraffe", picture: "images/animals/giraffe.jpg" },
      { word: "mouse", picture: "images/animals/mouse.jpg" },
      { word: "dog", picture: "images/animals/dog.jpg" },
      { word: "cat", picture: "images/animals/cat.jpg" },
      { word: "rabbit", picture: "images/animals/rabbit.jpg" },
      { word: "horse", picture: "images/animals/horse.jpg" },
      { word: "lion", picture: "images/animals/lion.jpg" },
      { word: "camel", picture: "images/animals/camel.jpg" },
      { word: "sheep", picture: "images/animals/sheep.jpg" }
    ];

    const sheet = document.getElementById("sheet");
    cards.forEach(card => {
      sheet.innerHTML += `
        <div class="card">
          <img src="${card.picture}" alt="${card.word}">
          <h2>${card.word}</h2>
        </div>`;
    });
  </script>
</body>
</html>
